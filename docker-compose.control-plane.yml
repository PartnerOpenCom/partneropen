services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: partneropen_control
      POSTGRES_USER: partneropen
      POSTGRES_PASSWORD: partneropen
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partneropen -d partneropen_control"]
      interval: 2s
      timeout: 3s
      retries: 15
